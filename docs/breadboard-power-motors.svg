<text x="60" y="1410" font-size="23" text-anchor="start" style="fill:#b57608" font-weight="bold">*STBY: keep enabled. If not already pulled HIGH on the carrier, use 3V3 after checking its pull-up.</text>
<rect x="60" y="1435" width="2280" height="160" rx="12" fill="#f9fafc" stroke="#b9c5cf" stroke-width="2" stroke-dasharray="9 6"/>
<text x="85" y="1472" font-size="24" text-anchor="start" style="fill:#172c40" font-weight="bold">OPTIONAL CRAWLER / MANIPULATOR</text>
<text x="85" y="1511" font-size="23" text-anchor="start" style="fill:#172c40">DRV3: GPIO16 -&gt; AIN1, GPIO19 -&gt; AIN2, AO1/AO2 -&gt; left3; GPIO24 -&gt; BIN1, GPIO25 -&gt; BIN2, BO1/BO2 -&gt; right3.</text>
<text x="85" y="1547" font-size="23" text-anchor="start" style="fill:#172c40">DRV3 uses the same VM / GND / STBY arrangement. Submarine mode leaves left3 and right3 off.</text>
<text x="85" y="1581" font-size="23" text-anchor="start" style="fill:#172c40">Arm signal GPIO27; gripper signal GPIO18. Each servo: +5V and GND direct; only one PWM active at a time.</text>
<text x="60" y="1631" font-size="23" text-anchor="start" style="fill:#52677b">Camera -&gt; CSI ribbon port. PC -&gt; Ethernet. No motor lead goes to GND. NC pins stay unused. Use one Pi power source.</text>
