<text x="70" y="1485" font-size="24" text-anchor="start" font-weight="bold">BUILD NOTES</text>
<text x="70" y="1525" font-size="21" text-anchor="start">• Use complete DRV8833 breakout boards with their onboard capacitors; this is not a bare-chip schematic.</text>
<text x="70" y="1557" font-size="21" text-anchor="start">• * STBY is the carrier enable label (nSLEEP on the DRV8833 chip); keep it HIGH. Never join 3V3 and +5V rails.</text>
<text x="70" y="1589" font-size="21" text-anchor="start">• The drawing shows the 5 V motor option. With a separate 6 V buck, move only driver VM feeds to that motor rail.</text>
<text x="70" y="1621" font-size="21" text-anchor="start">• Keep the Pi and servo on regulated 5 V, not the 6 V motor rail or raw 3S. Budget for servo startup/stall current.</text>
<text x="70" y="1653" font-size="21" text-anchor="start">• Do not power the Pi through its 5 V header and a separate USB supply at the same time.</text>
<text x="70" y="1685" font-size="21" text-anchor="start">• Connector numbering is a proposed assignment, not the physical pinout of your plugs. Wire both halves identically.</text>
<text x="70" y="1717" font-size="21" text-anchor="start">• The environment module already uses its six connector contacts; use a separate servo plug for the gimbal.</text>
<text x="70" y="1749" font-size="21" text-anchor="start">• I2C sensors and camera ribbon wiring are in the other guides. Servo PWM releases after 0.3 s by default.</text>
<text x="70" y="1820" font-size="18" text-anchor="start" style="fill:#50657a">References: TI DRV8833 datasheet; TowerPro MG90S; Raspberry Pi GPIO documentation; robot/config.json.</text>
</svg>